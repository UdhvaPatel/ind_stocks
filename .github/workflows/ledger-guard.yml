# The prediction ledger is append-only. This fails any push or pull request that changes or
# removes an existing ledger line (adding new lines at the end is the only allowed change).
name: ledger-guard

on:
  push:
    paths: ["data/ledger/**"]
  pull_request:
    paths: ["data/ledger/**"]

permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Only appends since the previous commit
        run: python -m pipeline.ledger_guard "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
